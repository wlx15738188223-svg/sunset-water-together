<!doctype html>
<html lang="zh-CN">
<head>

<title>与你共看落霞</title>
<style>
  :root { color-scheme: dark; font-family: "Songti SC","Noto Serif CJK SC","STSong",serif; }
  * { box-sizing: border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#34364b; }
  #scene { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #scene::selection { background:transparent; }
  .grain { position:fixed; inset:0; pointer-events:none; opacity:.13; mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.76' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E"); }
  .haze { position:fixed; inset:0; pointer-events:none; background:linear-gradient(180deg,rgba(16,22,43,.17),transparent 29%,transparent 79%,rgba(9,18,30,.18)); }
  .foreground { position:fixed; left:0; right:0; bottom:0; width:100%; height:24%; min-height:124px; pointer-events:none; }
  .couple { position:fixed; width:min(41vw,590px); height:auto; left:5.3%; bottom:3.3%; filter:drop-shadow(0 8px 13px rgba(12,20,29,.35)); pointer-events:none; transform-origin:bottom center; }
  .bird { position:fixed; left:0; top:0; width:68px; height:38px; pointer-events:none; filter:drop-shadow(0 0 3px rgba(255,199,165,.25)); }
  .bird .wing-left, .bird .wing-right { transform-box:fill-box; }
  .bird .wing-left { transform-origin:95% 72%; }
  .bird .wing-right { transform-origin:5% 72%; }
  .reeds { position:fixed; right:0; bottom:0; width:min(17vw,200px); height:39vh; pointer-events:none; transform-origin:bottom right; }
  .title { position:fixed; left:4.8%; top:7.4%; z-index:3; color:#fff3df; text-shadow:0 2px 22px rgba(43,40,60,.65); user-select:none; }
  .eyebrow { display:block; font:500 10px/1.6 system-ui,sans-serif; letter-spacing:.39em; text-transform:uppercase; opacity:.74; margin-bottom:16px; }
  h1 { font-weight:400; font-size:clamp(26px,3.2vw,46px); letter-spacing:.15em; margin:0; }
  .poem { display:block; margin-top:19px; font-size:clamp(12px,1.06vw,15px); letter-spacing:.19em; line-height:2; opacity:.82; }
  .controls { position:fixed; z-index:5; right:24px; bottom:22px; display:flex; gap:8px; align-items:center; font:12px system-ui,sans-serif; }
  #renderer { position:fixed; z-index:5; right:24px; top:22px; color:#fff4e7; background:rgba(34,38,53,.34); border:1px solid rgba(255,242,224,.3); border-radius:999px; padding:7px 11px; font:11px system-ui,sans-serif; backdrop-filter:blur(10px); }
  #renderer[hidden] { display:none; }
  button { border:1px solid rgba(255,242,224,.38); color:#fff7ec; background:rgba(34,38,53,.32); backdrop-filter:blur(12px); border-radius:999px; padding:9px 13px; min-width:42px; min-height:39px; cursor:pointer; transition:background .2s,border-color .2s; }
  button:hover,button:focus-visible { background:rgba(60,58,70,.66); border-color:rgba(255,242,224,.75); outline:none; }
  button:focus-visible { box-shadow:0 0 0 2px #fff3db; }
  #status { position:fixed; z-index:8; inset:0; display:none; align-items:center; justify-content:center; padding:28px; text-align:center; background:linear-gradient(#43445c,#ad7d78); color:#fff8eb; font:16px/1.9 system-ui,sans-serif; }
  #status p { max-width:32em; }
  @media (max-width:700px) {
    .title { left:7%; top:5.6%; }
    .eyebrow { font-size:9px; margin-bottom:11px; }
    h1 { font-size:27px; }
    .poem { font-size:11px; letter-spacing:.08em; margin-top:10px; }
    .couple { width:81vw; left:-3%; bottom:8%; }
    .foreground { height:19%; }
    .reeds { width:24vw; height:31vh; }
    .controls { right:12px; bottom:12px; gap:5px; }
    #renderer { right:12px; top:auto; bottom:58px; }
    button { font-size:11px; padding:7px 10px; }
  }
  @media (prefers-reduced-motion:reduce) { button { transition:none; } }
</style>

<div class="title"><span class="eyebrow">A quiet moment by the water</span><h1>与你共看落霞</h1><span class="poem">落霞与孤鹜齐飞，秋水共长天一色。</span></div>

<script>
(() => {
  let canvas = document.querySelector('#scene');
  const status = document.querySelector('#status');
  const statusText = document.querySelector('#statusText');
  const pauseButton = document.querySelector('#pause');
  const qualityButton = document.querySelector('#quality');
  const bird = document.querySelector('.bird');
  const reeds = document.querySelector('#reedsMotion');
  const couple = document.querySelector('.couple');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let paused = reduced.matches, sceneTime = 0, lastFrame = 0, quality = 0, pointerX = 0, pointerY = 0;
  let device, context, pipeline, bindGroup, uniformBuffer, format, raf, fallbackContext;
  let pixelScale = 1;

  function failure(message) { statusText.textContent = message; status.style.display = 'flex'; cancelAnimationFrame(raf); }
  function updatePauseLabel() { pauseButton.textContent = paused ? '继续' : '暂停'; pauseButton.setAttribute('aria-label', paused ? '继续动画' : '暂停动画'); }
  updatePauseLabel();
  pauseButton.onclick = () => { paused = !paused; lastFrame = performance.now(); updatePauseLabel(); };
  qualityButton.onclick = () => { quality = (quality + 1) % 3; qualityButton.textContent = ['画质：自动','画质：高','画质：省电'][quality]; resize(); };
  document.querySelector('#fullscreen').onclick = async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) { console.warn('无法切换全屏', e); } };
  reduced.addEventListener('change', e => { if (e.matches) { paused = true; updatePauseLabel(); } });
  addEventListener('pointermove', e => { pointerX = Math.max(-1,Math.min(1,e.clientX/innerWidth*2-1)); pointerY = Math.max(-1,Math.min(1,e.clientY/innerHeight*2-1)); }, {passive:true});

  const shader = /* wgsl */ `
struct Globals { viewport: vec4f, motion: vec4f };
@group(0) @binding(0) var<uniform> g: Globals;
struct Out { @builtin(position) position: vec4f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> Out {
  var o: Out;
  let p = array<vec2f,3>(vec2f(-1.0,-1.0),vec2f(3.0,-1.0),vec2f(-1.0,3.0));
  o.position = vec4f(p[i],0.0,1.0);
  return o;
}
fn hash(p: vec2f) -> f32 { return fract(sin(dot(p,vec2f(127.1,311.7)))*43758.5453); }
fn noise(p: vec2f) -> f32 {
  let i=floor(p); let f=fract(p); let u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2f(1.0,0.0)),u.x),mix(hash(i+vec2f(0.0,1.0)),hash(i+vec2f(1.0,1.0)),u.x),u.y);
}
fn fbm(p: vec2f) -> f32 {
  var v=0.0; var a=0.5; var q=p;
  for(var j=0;j<4;j=j+1){v+=a*noise(q);q=q*2.04+vec2f(8.2,1.7);a*=0.5;}
  return v;
}
fn sky(p: vec2f, sun: vec2f, t: f32) -> vec3f {
  let y=p.y; let low=vec3f(0.91,0.52,0.39); let mid=vec3f(0.66,0.51,0.63); let top=vec3f(0.26,0.36,0.51);
  var c=mix(low,mid,smoothstep(0.19,0.53,0.55-y));
  c=mix(c,top,smoothstep(0.36,0.93,0.56-y));
  let band=exp(-abs(y-0.525)*11.0); c+=vec3f(0.1,0.055,0.025)*band;
  let delta=vec2f((p.x-sun.x)*g.viewport.x/g.viewport.y,p.y-sun.y);
  let r=length(delta);
  c+=vec3f(0.98,0.48,0.23)*exp(-r*12.0)*0.33;
  c+=vec3f(1.0,0.72,0.42)*exp(-r*34.0)*0.28;
  let disk=1.0-smoothstep(0.053,0.061,r);
  c=mix(c,vec3f(1.0,0.79,0.54),disk*0.91);
  let n=fbm(vec2f(p.x*4.2+t*0.008,p.y*9.5-t*0.002));
  let streak=sin(p.x*18.0+p.y*17.0+noise(p*vec2f(8.0,3.0))*4.0)*0.5+0.5;
  let cloudMask=smoothstep(0.56,0.75,n*0.75+streak*0.33) * smoothstep(0.07,0.20,y) * (1.0-smoothstep(0.48,0.57,y));
  let cloudLow=vec3f(0.36,0.33,0.46);
  let cloudHigh=vec3f(0.97,0.59,0.48);
  let cloud=mix(cloudLow,cloudHigh,smoothstep(0.17,0.50,y)+exp(-r*7.0)*0.3);
  c=mix(c,cloud,cloudMask*0.62);
  let n2=fbm(vec2f(p.x*7.0-t*0.005,p.y*16.0));
  let thin=smoothstep(0.65,0.83,n2)*smoothstep(0.06,0.16,y)*(1.0-smoothstep(0.30,0.43,y));
  c=mix(c,vec3f(0.64,0.53,0.62),thin*0.21);
  return c;
}
@fragment fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f {
  let p=pos.xy/g.viewport.xy;
  let t=g.viewport.z;
  let sun=vec2f(0.69+g.viewport.w*0.012,0.445+g.motion.x*0.006);
  let horizon=0.545;
  var c=sky(p,sun,t);
  let ridge=0.540+0.010*sin(p.x*8.5)+0.005*sin(p.x*19.0+0.7)+0.0025*sin(p.x*48.0);
  let far=0.543+0.004*sin(p.x*14.0+2.1)+0.002*sin(p.x*39.0);
  if(p.y>ridge && p.y<horizon+0.013) {
    let fog=smoothstep(0.535,0.563,p.y);
    c=mix(c,vec3f(0.53,0.46,0.54),fog*0.37);
  }
  if(p.y>far && p.y<horizon+0.004) { c=mix(c,vec3f(0.64,0.50,0.54),0.20); }
  if(p.y>horizon) {
    let depth=clamp((p.y-horizon)/(1.0-horizon),0.0,1.0);
    let waveX=p.x+sin(p.y*92.0+t*0.32)*0.002*depth+sin(p.y*173.0-t*0.47)*0.0013*depth;
    let wave=sin(p.y*(135.0+depth*135.0)+sin(waveX*33.0+t*0.32)*2.0+t*0.31);
    let small=sin(p.y*360.0+waveX*120.0+t*0.73)*sin(p.y*210.0-waveX*89.0-t*0.44);
    let swell=noise(vec2f(waveX*18.0,p.y*88.0-t*0.30));
    var water=mix(vec3f(0.64,0.52,0.55),vec3f(0.15,0.27,0.36),smoothstep(0.0,0.95,depth));
    water+=vec3f(0.10,0.11,0.14)*(wave*0.5+small*0.22+swell*0.3)*(0.15+depth*0.38);
    let wavering=sin(p.y*125.0+t*0.62)*0.013*depth+sin(p.y*272.0-t*0.38)*0.009*depth
      +(noise(vec2f(floor(p.y*(170.0+depth*300.0))*0.074,t*0.08))-0.5)*(0.012+depth*0.075);
    let xdist=abs(p.x-(sun.x+wavering+sin(p.y*36.0+t*0.18)*0.003));
    let reach=exp(-xdist/(0.011+depth*0.145));
    let strip=sin(p.y*(220.0+depth*470.0)+noise(vec2f(p.x*38.0,p.y*38.0))*4.0+t*(0.2+depth*0.7));
    let shards=pow(max(strip,0.0),3.0);
    let grain=hash(floor(vec2f(p.x*(180.0+depth*70.0),p.y*(230.0+depth*520.0))));
    let glint=shards*(0.25+grain*0.75)*reach*(1.0-smoothstep(0.77,1.0,depth));
    let wideGlow=reach*0.13*(1.0-depth*0.35);
    water+=vec3f(1.0,0.68,0.37)*(glint*1.38+wideGlow);
    let ripple=pow(max(wave*0.72+small*0.22,0.0),3.0)*depth*0.15;
    water+=vec3f(0.49,0.41,0.44)*ripple;
    let seam=smoothstep(horizon,horizon+0.02,p.y);
    c=mix(c,water,seam);
  }
  let vignette=1.0-0.23*pow(length((p-vec2f(0.50,0.46))*vec2f(1.05,0.84)),1.7);
  c*=vignette;
  c+=(hash(pos.xy)-0.5)/255.0;
  return vec4f(clamp(c,vec3f(0.0),vec3f(1.0)),1.0);
}`;

  function resize() {
    if ((!device || !context) && !fallbackContext) return;
    const dpr = Math.min(devicePixelRatio || 1, quality === 1 ? 1.8 : quality === 2 ? 0.75 : 1.25);
    const maxPixels = quality === 1 ? 2600000 : quality === 2 ? 800000 : 1500000;
    const s = Math.min(1, Math.sqrt(maxPixels/(innerWidth*innerHeight*dpr*dpr)));
    pixelScale = dpr*s;
    canvas.width = Math.max(1,Math.floor(innerWidth*pixelScale));
    canvas.height = Math.max(1,Math.floor(innerHeight*pixelScale));
    if (fallbackContext) fallbackContext.setTransform(pixelScale,0,0,pixelScale,0,0);
    else context.configure({device,format,alphaMode:'opaque'});
  }
  function tick(now) {
    if (!lastFrame) lastFrame=now;
    const delta=Math.min((now-lastFrame)/1000,0.05); lastFrame=now;
    if (!paused) sceneTime+=delta;
  }
  function updateForeground() {
    // WebGPU and Canvas 2D use this same pausable clock.
    const cycle=(sceneTime*0.018+0.22)%1;
    const bx=innerWidth*(-0.12+1.26*cycle);
    const by=innerHeight*(0.34-0.05*Math.sin(cycle*Math.PI)+0.018*Math.sin(sceneTime*0.31));
    bird.style.transform=`translate(${bx}px,${by}px) scale(${Math.min(1.2,Math.max(.63,innerWidth/1400))}) rotate(${Math.sin(sceneTime*.37)*4}deg)`;
    const flap=Math.sin(sceneTime*4.3)*25;
    bird.querySelector('.wing-left').style.transform=`rotate(${-flap}deg)`;
    bird.querySelector('.wing-right').style.transform=`rotate(${flap}deg)`;
    reeds.style.transform=`rotate(${Math.sin(sceneTime*.61)*2.2}deg)`;
    couple.style.transform=`translateY(${Math.sin(sceneTime*1.17)*.65}px)`;
  }
  function draw(now) {
    if (!device) return;
    tick(now);
    const u = new Float32Array([canvas.width,canvas.height,sceneTime,pointerX, pointerY,quality,0,0]);
    device.queue.writeBuffer(uniformBuffer,0,u);
    const encoder=device.createCommandEncoder();
    const pass=encoder.beginRenderPass({colorAttachments:[{view:context.getCurrentTexture().createView(),loadOp:'clear',storeOp:'store',clearValue:{r:0.2,g:0.25,b:0.3,a:1}}]});
    pass.setPipeline(pipeline); pass.setBindGroup(0,bindGroup); pass.draw(3); pass.end();
    device.queue.submit([encoder.finish()]);
    updateForeground();
    raf=requestAnimationFrame(draw);
  }
  function paintFallback() {
    const ctx=fallbackContext, W=innerWidth, H=innerHeight, t=sceneTime;
    const horizon=H*0.545, sunX=W*(0.69+pointerX*0.012), sunY=H*(0.445+pointerY*0.006);
    ctx.setTransform(pixelScale,0,0,pixelScale,0,0);
    const sky=ctx.createLinearGradient(0,0,0,horizon);
    sky.addColorStop(0,'#46536f'); sky.addColorStop(.38,'#ab8198'); sky.addColorStop(.77,'#ed927d'); sky.addColorStop(1,'#f2a476');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,horizon+2);
    const glow=ctx.createRadialGradient(sunX,sunY,8,sunX,sunY,H*.37);
    glow.addColorStop(0,'rgba(255,214,145,.46)'); glow.addColorStop(.23,'rgba(255,182,128,.20)'); glow.addColorStop(1,'rgba(255,176,126,0)');
    ctx.fillStyle=glow; ctx.fillRect(0,0,W,horizon);
    const cloudShapes=[[.08,.26,.25,.045],[.42,.23,.28,.058],[.82,.17,.22,.05],[.21,.39,.20,.025],[.75,.31,.26,.034],[.55,.12,.18,.032]];
    for (let i=0;i<cloudShapes.length;i++) {
      const c=cloudShapes[i], cx=W*(c[0]+Math.sin(t*.016+i)*.006), cy=H*c[1];
      ctx.save(); ctx.translate(cx,cy); ctx.scale(W*c[2],H*c[3]);
      const mist=ctx.createRadialGradient(0,0,.08,0,0,1);
      mist.addColorStop(0,i%2?'rgba(72,65,86,.28)':'rgba(94,71,88,.25)');
      mist.addColorStop(.72,'rgba(128,91,105,.14)'); mist.addColorStop(1,'rgba(128,91,105,0)');
      ctx.fillStyle=mist; ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
    ctx.fillStyle='#ffdaa1'; ctx.beginPath(); ctx.arc(sunX,sunY,H*.057,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0,horizon+3);
    for (let x=0;x<=W+8;x+=8) ctx.lineTo(x,horizon-H*(.003+.007*Math.sin(x/W*8.5)+.002*Math.sin(x/W*19+.7)));
    ctx.lineTo(W,horizon+11); ctx.lineTo(0,horizon+11); ctx.closePath(); ctx.fillStyle='rgba(100,83,102,.25)'; ctx.fill();
    const water=ctx.createLinearGradient(0,horizon,0,H);
    water.addColorStop(0,'#a48b93'); water.addColorStop(.30,'#676f80'); water.addColorStop(1,'#263f52');
    ctx.fillStyle=water; ctx.fillRect(0,horizon,W,H-horizon);
    const waveCount=quality===2?75:quality===1?150:112;
    for (let i=0;i<waveCount;i++) {
      const depth=(i+.5)/waveCount, y=horizon+(H-horizon)*depth;
      const a=(.06+depth*.13)*(0.6+0.4*Math.sin(i*1.73+t*.25));
      ctx.strokeStyle=`rgba(214,199,198,${a})`; ctx.lineWidth=.65+depth*.75;
      ctx.beginPath();
      for (let x=0;x<=W+18;x+=18) {
        const yy=y+Math.sin(x*.024+i*.8+t*.36)*(.3+depth*1.4);
        if(x===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
      }
      ctx.stroke();
    }
    const hash=n=>{const v=Math.sin(n*127.1)*43758.5453;return v-Math.floor(v);};
    const glints=quality===2?135:quality===1?320:225;
    for (let i=0;i<glints;i++) {
      const d=(i+.5)/glints, y=horizon+(H-horizon)*Math.pow(d,.92);
      const spread=(.015+d*.18)*W;
      const sway=Math.sin(y*.12+t*.62)*d*W*.011;
      const x=sunX+sway+(hash(i*9.73)-.5)*spread*1.8;
      const width=(2+hash(i*4.11)*18)*(0.5+d*1.2);
      const strength=(.16+hash(i*2.27)*.5)*(1-d*.57);
      ctx.strokeStyle=`rgba(255,214,158,${strength})`; ctx.lineWidth=.65+d*1.55;
      ctx.beginPath(); ctx.moveTo(x-width*.5,y); ctx.lineTo(x+width*.5,y+Math.sin(i+t*.23)*.4); ctx.stroke();
    }
    const vignette=ctx.createRadialGradient(W*.5,H*.47,H*.08,W*.5,H*.47,Math.max(W,H)*.78);
    vignette.addColorStop(0,'rgba(19,27,43,0)'); vignette.addColorStop(1,'rgba(16,24,36,.22)');
    ctx.fillStyle=vignette; ctx.fillRect(0,0,W,H);
  }
  function drawFallback(now) {
    if (!fallbackContext) return;
    tick(now); paintFallback(); updateForeground(); raf=requestAnimationFrame(drawFallback);
  }
  function initFallback(reason) {
    if (fallbackContext) return;
    console.info('使用 Canvas 2D 兼容模式：',reason);
    cancelAnimationFrame(raf);
    device=null; context=null;
    const replacement=canvas.cloneNode(false);
    canvas.replaceWith(replacement); canvas=replacement;
    canvas.setAttribute('aria-label','Canvas 2D 兼容模式绘制的落日、晚霞与秋水');
    fallbackContext=canvas.getContext('2d',{alpha:false});
    if (!fallbackContext) { failure('此浏览器无法创建绘图画布，请更新 Edge 后重试。'); return; }
    document.querySelector('#renderer').hidden=false;
    lastFrame=performance.now(); resize(); raf=requestAnimationFrame(drawFallback);
  }
  async function init() {
    if (new URLSearchParams(location.search).get('renderer')==='canvas') { initFallback('手动选择'); return; }
    if (!isSecureContext || !navigator.gpu) { initFallback('WebGPU 不可用'); return; }
    try {
      const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});
      if (!adapter) throw new Error('未找到可用的 WebGPU 图形适配器');
      device=await adapter.requestDevice();
      device.lost.then(info => initFallback(`WebGPU 设备已断开：${info.message || '未知原因'}`));
      context=canvas.getContext('webgpu');
      if (!context) throw new Error('无法创建 WebGPU 绘图上下文');
      format=navigator.gpu.getPreferredCanvasFormat();
      const module=device.createShaderModule({code:shader});
      const errors=await module.getCompilationInfo();
      const shaderErrors=errors.messages.filter(m=>m.type==='error');
      if (shaderErrors.length) throw new Error(shaderErrors.map(m=>`第 ${m.lineNum} 行：${m.message}`).join('\n'));
      pipeline=device.createRenderPipeline({layout:'auto',vertex:{module,entryPoint:'vs'},fragment:{module,entryPoint:'fs',targets:[{format}]},primitive:{topology:'triangle-list'}});
      uniformBuffer=device.createBuffer({size:32,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
      bindGroup=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:uniformBuffer}}]});
      resize();
      raf=requestAnimationFrame(draw);
    } catch(e) { initFallback(e.message || String(e)); }
  }
  addEventListener('resize',resize);
  init();
})();
</script>
</body>
